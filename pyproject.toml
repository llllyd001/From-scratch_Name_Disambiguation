[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-name-disambiguation"
version = "0.1.0"
description = "Research tools for LLM-based from-scratch author name disambiguation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "joblib>=1.3",
  "numpy>=1.24",
  "openai>=1.0",
  "pandas>=2.0",
  "plotly>=5.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]

[project.scripts]
snd-cluster = "name_disambiguation.core.llm_cluster:main"
snd-evaluate = "name_disambiguation.evaluation.snd_eval:main"
snd-router = "name_disambiguation.reliability.router:main"

[tool.setuptools.packages.find]
where = ["src"]
